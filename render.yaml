# One-click deployment on Render (https://render.com): New → Blueprint → pick
# this repository. It creates the web app, a Postgres database and a disk for
# uploaded documents. Render asks for the values marked `sync: false`; any can
# be left blank at first and filled in later under the service's Environment tab.
# See docs/LAUNCH_GUIDE.md for a step-by-step walkthrough.
services:
  - type: web
    name: comvera
    runtime: node
    # Frankfurt is Render's closest region to South Africa.
    region: frankfurt
    # Starter: 0.5 CPU, 512 MB. Disks need a paid instance.
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: comvera-db
          property: connectionString
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/uploads
      - key: DEMO_SANDBOX_ENABLED
        value: "true"
      # 14-day trials, plans, promo codes and site sponsorship are enforced from day one.
      # Card payments switch on separately when STRIPE_SECRET_KEY is set.
      - key: ENFORCE_PLANS
        value: "true"
      # Your address once the domain is connected, e.g. https://app.comvera.co.za.
      # Until then Render's own onrender.com address is used automatically.
      - key: APP_URL
        sync: false
      # Email, e.g. smtps://resend:YOUR_RESEND_API_KEY@smtp.resend.com:465
      - key: SMTP_URL
        sync: false
      # e.g. COMVERA <no-reply@comvera.co.za> (the domain must be verified with your email provider)
      - key: EMAIL_FROM
        sync: false
      # Your own address: "Report a problem" messages from users are emailed here.
      - key: SUPPORT_EMAIL
        sync: false
      # Your own address(es), comma-separated: you see More → Platform once the email is confirmed.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Phone number on the public contact page, e.g. +27 82 000 0000 (optional).
      - key: CONTACT_PHONE
        sync: false
      # Claude API key from console.anthropic.com. Blank = built-in templates and rules.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Stripe is optional; leave blank to invoice customers yourself.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: comvera-db
    region: frankfurt
    # Smallest paid plan (0.1 CPU, 256 MB). The free plan expires after 30 days.
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: comvera
    user: comvera
