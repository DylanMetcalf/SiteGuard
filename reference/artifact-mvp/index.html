<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiteGuard — Contractor Compliance &amp; Site Operations</title>
<meta name="description" content="SiteGuard — contractor compliance, safety files, and site operations for mining and industrial sites.">
<meta name="theme-color" content="#15181B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* light — engineering-drawing paper */
  --ink:#15181B; --ink-soft:#3E444A; --grey:#6B7178; --grey-line:#C7CABC;
  --paper:#E3E5DB; --paper-raised:#F1F2EA; --paper-deep:#D5D8C9;
  --orange:#C85417; --orange-ink:#6E2A08; --orange-bg:#F2DCC8;
  --blue:#2A4E62; --blue-bg:#DCE6EA;
  --green:#2C6B44; --green-bg:#DCEBDD;
  --amber:#8E6410; --amber-bg:#EFE2C4;
  --red:#A23A2D; --red-bg:#F1DAD5;
  /* panel: fixed instrument-cluster surface, same in both themes */
  --panel:#15171A; --panel-raised:#1D2023; --panel-line:#33372F;
  --panel-ink:#EEF0E9; --panel-ink-soft:#A7ACA2;
  --radius:3px;
  --font-head:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECEEE8; --ink-soft:#B7BCB3; --grey:#82877E; --grey-line:#2E322A;
    --paper:#16181A; --paper-raised:#1D2022; --paper-deep:#0F1112;
    --orange:#EE7B3F; --orange-ink:#FAD6BB; --orange-bg:#3A2313;
    --blue:#8CACBC; --blue-bg:#1C2A31;
    --green:#7BBE93; --green-bg:#17281D;
    --amber:#D7AD54; --amber-bg:#302506;
    --red:#DE8776; --red-bg:#301C17;
    --panel:#0E1011; --panel-raised:#17191B; --panel-line:#2A2E27;
  }
}
:root[data-theme="dark"]{
  --ink:#ECEEE8; --ink-soft:#B7BCB3; --grey:#82877E; --grey-line:#2E322A;
  --paper:#16181A; --paper-raised:#1D2022; --paper-deep:#0F1112;
  --orange:#EE7B3F; --orange-ink:#FAD6BB; --orange-bg:#3A2313;
  --blue:#8CACBC; --blue-bg:#1C2A31;
  --green:#7BBE93; --green-bg:#17281D;
  --amber:#D7AD54; --amber-bg:#302506;
  --red:#DE8776; --red-bg:#301C17;
  --panel:#0E1011; --panel-raised:#17191B; --panel-line:#2A2E27;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100%;
}
h1,h2,h3,h4{font-family:var(--font-head); font-weight:600; letter-spacing:-.01em;}
button{font-family:var(--font-body); cursor:pointer;}
a{color:inherit;}
.mono{font-family:var(--font-mono);}

/* ---- shell ---- */
#app{max-width:920px; margin:0 auto; padding-bottom:88px;}
.topbar{position:sticky; top:0; z-index:20; border-bottom:1px solid var(--grey-line); background:var(--paper);}
.brand-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
}
.brand{display:flex; align-items:center; gap:9px;}
.brand-mark{width:24px;height:24px;background:var(--ink);position:relative;flex:none; border-radius:6px;}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:var(--orange); border-radius:2px;}
.brand-mark:before{left:4px;top:4px;width:7px;height:7px;}
.brand-mark:after{right:4px;bottom:4px;width:7px;height:7px;}
.brand-text{line-height:1.1;}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:16.5px;letter-spacing:-.01em;}
.brand-tag{font-size:9.5px;letter-spacing:.06em;color:var(--grey);text-transform:uppercase;}
.identity{display:flex; align-items:center; gap:5px;}
.identity select{
  border:1px solid var(--grey-line); border-radius:20px; background:var(--paper-raised); color:var(--ink);
  font-family:var(--font-body); font-size:10.5px; font-weight:600; padding:6px 8px; max-width:88px;
}
.identity select:focus{outline:none;}
.identity-avatar{
  width:29px;height:29px;border-radius:50%;background:var(--panel);color:var(--panel-ink);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;
  font-family:var(--font-head); border:none; cursor:pointer; position:relative;
}
.identity-avatar .ic{width:15px;height:15px;}
.bell-dot{position:absolute; top:4px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--orange); border:1.5px solid var(--paper);}

/* ---- bottom nav with center FAB (app shell, not console) ---- */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:920px; margin:0 auto;
  background:var(--paper-raised); border-top:1px solid var(--grey-line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.bottomnav-row{display:flex; align-items:flex-end; justify-content:space-around; padding:6px 6px 8px;}
.bottomnav button[data-nav]{
  flex:1; max-width:84px; background:none; border:none; color:var(--grey); font-size:10.5px; font-weight:500;
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px 4px;
  font-family:var(--font-body);
}
.bottomnav button[data-nav] .ic{width:20px;height:20px;}
.bottomnav button[data-nav].active{color:var(--orange);}
.bottomnav button[data-nav].active .ic path,.bottomnav button[data-nav].active .ic rect,.bottomnav button[data-nav].active .ic circle{stroke:var(--orange);}
.fab{
  width:52px; height:52px; border-radius:50%; background:var(--orange); color:#fff; border:none;
  display:flex; align-items:center; justify-content:center; margin-top:-22px; flex:none;
  box-shadow:0 4px 14px rgba(0,0,0,.28); border:3px solid var(--paper-raised);
}

/* ---- FAB quick-action sheet ---- */
.qa-item{
  display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--grey-line);
  background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;
}
.qa-item:last-child{border-bottom:none;}
.qa-icon{
  width:38px;height:38px; border-radius:10px; background:var(--paper-deep); display:flex; align-items:center; justify-content:center; flex:none;
}
.qa-title{font-weight:600; font-size:14px;}
.qa-sub{font-size:11.5px; color:var(--grey); margin-top:1px;}

/* ---- content ---- */
.view{padding:16px 16px 28px;}
.view-head{margin-bottom:14px;}
.onboard-wrap{max-width:420px;margin:0 auto;padding:28px 16px 40px;}
.demo-tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.06em;background:var(--amber);color:#1a1400;padding:1px 5px;border-radius:4px;vertical-align:middle;margin-left:4px;}
.view-head h1{font-size:19px;}
.view-head p{color:var(--grey); font-size:12.5px; margin-top:3px;}
.section-title{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--grey); margin:20px 0 9px; font-weight:600; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}
.section-title:after{content:""; flex:1; height:1px; background:var(--grey-line);}

/* corner-bracket card: blueprint checkpoint motif */
.card{
  position:relative; background:var(--paper-raised); border:1px solid var(--grey-line);
  padding:13px; margin-bottom:9px; border-radius:var(--radius);
}
.card.checkpoint:before,.card.checkpoint:after{
  content:""; position:absolute; width:7px; height:7px; border:1.5px solid var(--grey-line);
}
.card.checkpoint:before{top:-1px; left:-1px; border-right:none; border-bottom:none;}
.card.checkpoint:after{bottom:-1px; right:-1px; border-left:none; border-top:none;}

.attn-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
.attn-card{
  background:var(--paper-raised); border:1px solid var(--grey-line); border-radius:var(--radius);
  padding:11px 12px; cursor:pointer;
}
.attn-num{font-family:var(--font-mono); font-size:24px; font-weight:500; line-height:1;}
.attn-label{font-size:11.5px; color:var(--grey); margin-top:5px;}
.attn-card.red .attn-num{color:var(--red);}
.attn-card.amber .attn-num{color:var(--amber);}
.attn-card.blue .attn-num{color:var(--blue);}
.attn-card.green .attn-num{color:var(--green);}

/* portfolio row — dense ops-board style, replaces loose app cards on the home board */
.portfolio-row{
  display:flex; align-items:center; gap:11px; padding:11px 12px; border:1px solid var(--grey-line);
  border-radius:var(--radius); background:var(--paper-raised); margin-bottom:6px; cursor:pointer;
}
.portfolio-bar{flex:1; min-width:0;}
.portfolio-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.portfolio-name{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.portfolio-pct{font-family:var(--font-mono); font-size:13px; flex:none;}
.portfolio-track{height:5px; background:var(--paper-deep); border-radius:3px; margin-top:6px; overflow:hidden;}
.portfolio-fill{height:100%; border-radius:3px;}
.portfolio-sub{font-size:11px; color:var(--grey); margin-top:5px;}

.site-card{display:flex; align-items:center; gap:12px; padding:13px;}
.gauge{
  position:relative; width:48px; height:48px; flex:none; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.gauge svg{position:absolute; inset:0; transform:rotate(-90deg);}
.gauge span{font-family:var(--font-mono); font-weight:500; font-size:12px;}
.site-card-body{flex:1; min-width:0;}
.site-card-title{font-weight:600; font-size:14.5px;}
.site-card-sub{font-size:12px; color:var(--grey); margin-top:2px;}
.site-card-arrow{color:var(--grey); flex:none;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:3px;}
.badge.complete{background:var(--green-bg); color:var(--green);}
.badge.missing{background:var(--red-bg); color:var(--red);}
.badge.expiring{background:var(--amber-bg); color:var(--amber);}
.badge.awaiting_review{background:var(--blue-bg); color:var(--blue);}
.badge.correction_required{background:var(--red-bg); color:var(--red);}
.badge.expired{background:var(--red-bg); color:var(--red);}
.badge.approved{background:var(--green-bg); color:var(--green);}
.badge dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:block;}

.reqrow{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--grey-line);}
.reqrow:last-child{border-bottom:none;}
.reqrow-main{flex:1; min-width:0;}
.reqrow-name{font-size:13.5px; font-weight:500;}
.reqrow-meta{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; align-items:center;}
.srctag{font-size:10px; padding:2px 7px; border-radius:3px; border:1px solid var(--grey-line); color:var(--grey);}
.reqrow-chevron{color:var(--grey); flex:none;}

.btn{
  font-size:13px; font-weight:600; padding:9px 14px; border-radius:var(--radius); border:1px solid var(--ink);
  background:var(--ink); color:var(--paper); display:inline-flex; align-items:center; gap:6px;
}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--grey-line);}
.btn.orange{background:var(--orange); border-color:var(--orange); color:#fff;}
.btn.danger{background:transparent; border-color:var(--red); color:var(--red);}
.btn.block{width:100%; justify-content:center;}
.btn.small{padding:6px 10px; font-size:11.5px;}
.btn.icon{padding:7px 9px;}
.btn:disabled{opacity:.4;}

.readiness-hero{display:flex; align-items:center; gap:15px; padding:16px 14px;}
.readiness-hero .gauge{width:70px;height:70px;}
.readiness-hero .gauge span{font-size:17px;}
.why-link{font-size:11.5px; color:var(--blue); text-decoration:underline; cursor:pointer; margin-top:4px; display:inline-block;}

.breakdown-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--grey-line); font-size:13px;}
.breakdown-row:last-child{border-bottom:none;}

.thread{border-top:1px solid var(--grey-line); margin-top:11px; padding-top:9px;}
.thread-item{padding:7px 0; border-bottom:1px dashed var(--grey-line);}
.thread-item:last-child{border-bottom:none;}
.thread-who{font-size:11.5px; font-weight:600;}
.thread-role{font-size:10px; color:var(--grey); font-weight:400;}
.thread-text{font-size:13px; margin-top:3px;}
.thread-ts{font-size:10px; color:var(--grey); margin-top:3px;}

textarea,input[type=text],input[type=date],input[type=number],select.field{
  width:100%; font-family:var(--font-body); font-size:14px; padding:9px 10px;
  border:1px solid var(--grey-line); border-radius:var(--radius); background:var(--paper); color:var(--ink);
}
textarea{min-height:60px; resize:vertical;}
label.field-label{font-size:11px; color:var(--grey); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:5px; margin-top:10px;}

.overlay{position:fixed; inset:0; background:rgba(10,11,9,.55); z-index:50; display:flex; align-items:flex-end;}
.sheet{
  background:var(--paper); width:100%; max-height:88vh; overflow-y:auto; border-radius:10px 10px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--grey-line);
}
@media(min-width:640px){
  .overlay{align-items:center; justify-content:center;}
  .sheet{max-width:480px; border-radius:var(--radius); max-height:82vh;}
}
.sheet-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
.sheet-close{background:none; border:none; color:var(--grey); font-size:20px; line-height:1; padding:2px 6px;}

.empty{padding:32px 16px; text-align:center; color:var(--grey);}
.empty h3{color:var(--ink); font-size:14.5px; margin-bottom:6px;}
.empty p{font-size:12.5px; margin-bottom:14px;}

.audit-row{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--grey-line);}
.audit-row:last-child{border-bottom:none;}
.audit-dot{width:7px;height:7px;border-radius:50%;background:var(--grey-line);margin-top:5px;flex:none;}
.audit-dot.action{background:var(--orange);}
.audit-body{flex:1;}
.audit-action{font-size:13px;}
.audit-meta{font-size:11px; color:var(--grey); margin-top:2px;}

.verify-card{
  background:var(--panel); color:var(--panel-ink); padding:22px; border-radius:6px; text-align:center;
}
.verify-card .stamp{display:inline-block; border:2px solid var(--orange); color:var(--orange); padding:4px 12px; font-size:10.5px; letter-spacing:.08em; margin-bottom:14px; border-radius:3px;}
.verify-card .qr{width:106px;height:106px;background:#fff;margin:0 auto 14px; display:flex; align-items:center; justify-content:center;}
.verify-card h3{font-size:16px; margin-bottom:2px;}
.verify-card .vrow{display:flex; justify-content:space-between; font-size:12px; padding:7px 0; border-top:1px solid var(--panel-line); text-align:left;}
.verify-card .vid{font-family:var(--font-mono); font-size:10.5px; opacity:.7; margin-top:12px;}

.notice{background:var(--blue-bg); color:var(--blue); font-size:12px; padding:9px 11px; border-radius:var(--radius); margin-bottom:11px; border-left:2px solid var(--blue);}
.divider{height:1px; background:var(--grey-line); margin:15px 0;}
.muted{color:var(--grey);}
.flexbetween{display:flex; align-items:center; justify-content:space-between;}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel); color:var(--panel-ink);
  padding:9px 16px; border-radius:var(--radius); font-size:12px; z-index:60; max-width:88%; text-align:center;
  border:1px solid var(--panel-line);
}
::-webkit-scrollbar{width:0;height:0;}
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; left:0; top:0; width:100%; padding:24px; color:#111; background:#fff;}
  #printArea h1{font-size:20px; margin-bottom:2px;}
  #printArea .p-sub{color:#555; font-size:12px; margin-bottom:14px;}
  #printArea table{width:100%; border-collapse:collapse; margin-bottom:16px;}
  #printArea th,#printArea td{border:1px solid #ccc; padding:6px 8px; font-size:11px; text-align:left;}
  #printArea th{background:#eee;}
  #printArea .p-section{font-size:13px; font-weight:700; margin:16px 0 6px;}
  #printArea .p-foot{font-size:10px; color:#777; margin-top:20px;}
}
.inspection-card{margin-bottom:9px;}
.defect-row{border-top:1px dashed var(--grey-line); padding:9px 0;}
.defect-row:first-child{border-top:none;padding-top:0;}
.sev{font-size:10px; padding:2px 7px; border-radius:3px; font-weight:600;}
.sev.high{background:var(--red-bg); color:var(--red);}
.sev.medium{background:var(--amber-bg); color:var(--amber);}
.sev.low{background:var(--blue-bg); color:var(--blue);}
.subtabs{display:flex; gap:6px; margin-bottom:14px;}
.subtabs button{flex:1; padding:9px; border:1px solid var(--grey-line); background:var(--paper-raised); font-size:12.5px; font-weight:600; color:var(--grey); border-radius:var(--radius);}
.subtabs button.active{color:var(--ink); border-color:var(--ink); background:var(--paper);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--grey-line);}

/* diary */
.diary-row{padding:9px 0; border-bottom:1px dashed var(--grey-line); font-size:12.5px;}
.diary-row:last-child{border-bottom:none;}
.diary-head{display:flex; justify-content:space-between; font-weight:600;}
.diary-incident{color:var(--red); font-weight:600;}

/* score ring, used for contractor reliability */
.score-pill{display:inline-flex; align-items:baseline; gap:4px; font-family:var(--font-mono); font-size:15px; font-weight:500;}
.score-pill .lbl{font-family:var(--font-body); font-size:10.5px; color:var(--grey); font-weight:500;}

/* emergency sheet */
.ecard{background:var(--red-bg); color:var(--red); border-radius:var(--radius); padding:11px 12px; margin-bottom:9px;}
.ecard .elabel{font-size:10px; text-transform:uppercase; letter-spacing:.06em; opacity:.85;}
.ecard .eval{font-size:14.5px; font-weight:600; margin-top:2px; color:var(--ink);}

/* splash */
.splash{position:fixed; inset:0; z-index:100; background:var(--panel); color:var(--panel-ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .35s ease;}
.splash-mark{width:56px;height:56px;background:var(--orange);border-radius:14px;position:relative;}
.splash-mark:before,.splash-mark:after{content:"";position:absolute;background:var(--panel);border-radius:3px;}
.splash-mark:before{left:11px;top:11px;width:13px;height:13px;}
.splash-mark:after{right:11px;bottom:11px;width:13px;height:13px;}
.splash h1{font-family:var(--font-head);font-size:22px;font-weight:700;}
.splash p{font-size:13px;color:var(--panel-ink-soft);}
.splash.fade{opacity:0;pointer-events:none;}

/* onboarding tutorial */
.tut-card{padding:26px 24px calc(24px + env(safe-area-inset-bottom,0px));}
.tut-icon{width:52px;height:52px;border-radius:14px;background:var(--orange-bg);color:var(--orange);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.tut-card h2{font-size:19px;margin-bottom:8px;}
.tut-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
.tut-dots{display:flex;gap:5px;justify-content:center;margin:18px 0;}
.tut-dots span{width:6px;height:6px;border-radius:50%;background:var(--grey-line);}
.tut-dots span.active{background:var(--orange);width:16px;border-radius:3px;}

/* guided dashboard */
.greeting{font-size:12px;color:var(--grey);}
.site-picker-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px;}
.site-picker-chip{
  flex:none; padding:9px 13px; border:1px solid var(--grey-line); border-radius:20px; background:var(--paper-raised);
  font-size:12.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap;
}
.site-picker-chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.focus-card{padding:18px 16px;}
.focus-card .site-card-title{font-size:16.5px;}
.mini-stats{display:flex; gap:0; margin-top:14px; border-top:1px solid var(--grey-line); padding-top:12px;}
.mini-stat{flex:1; text-align:center;}

/* ============ PERSISTENCE ============ */
async function initPersistence(){
  try{
    db = await claude.use('db');
  }catch(e){ db = null; }
  try{ userCap = await claude.use('user'); }catch(e){ userCap = null; }
  try{ assetsCap = await claude.use('assets'); }catch(e){ assetsCap = null; }
  try{ sampleCap = await claude.use('sample'); }catch(e){ sampleCap = null; }
  let myId = null;
  if(userCap){
    try{
      myId = await userCap.id();
      if(myId){
        const profiles = await userCap.profiles([myId]);
        const p = profiles && profiles[myId];
        if(p && p.name) realViewerName = p.name;
      }
    }catch(e){ /* stay anonymous */ }
  }
  if(db){
    try{
      const ref = db.doc('app/state');
      const snap = await ref.get();
      if(snap.exists && snap.data() && snap.data().sites){
        state = snap.data();
      }else{
        await ref.set(state);
      }
      ref.onSnapshot((s)=>{
        if(s.exists && s.data() && s.data().sites){
          state = s.data();
          render();
        }
      });
    }catch(e){ /* proceed with in-memory demo state */ }
    if(myId){
      try{
        const pref = db.doc('profiles/'+myId);
        const psnap = await pref.get();
        if(psnap.exists && psnap.data()) profile = Object.assign(profile, psnap.data());
      }catch(e){ /* local-only profile this session */ }
    }
  }
  render();
}
async function saveProfile(myId, data){
  profile = Object.assign({}, profile, data);
  if(db && myId){
    try{ await db.doc('profiles/'+myId).set(profile); }catch(e){ /* kept locally this session */ }
  }
  render();
}
async function persist(){
  render();
  if(db){
    try{ await db.doc('app/state').set(state); }catch(e){ /* stays local this session */ }
  }
}

function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 2400);
}

/* ============ READINESS ENGINE ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.round((d - new Date(new Date().toDateString())) / 86400000);
}
function effectiveStatus(doc){
  if(!doc || !doc.status) return 'missing';
  if((doc.status==='complete' || doc.status==='expiring') && doc.expiryDate){
    const days = daysUntil(doc.expiryDate);
    if(days!==null){
      if(days<0) return 'expired';
      if(days<=30) return 'expiring';
      return 'complete';
    }
  }
  return doc.status;
}
function openSafetyIssues(siteId){
  const incidents = ((state.incidents && state.incidents[siteId]) || []).filter(inc=>inc.status!=='closed');
  const severeIncidents = incidents.filter(inc=>inc.type==='lost_time' || inc.type==='fatality');
  const expiredPermits = ((state.permits && state.permits[siteId]) || []).filter(p=>permitEffectiveStatus(p)==='expired');
  return { incidents, severeIncidents, expiredPermits, count: incidents.length + expiredPermits.length };
}
function orgOpenSafetyIssuesCount(){
  return Object.keys(state.sites).reduce((sum, id)=> sum + openSafetyIssues(id).count, 0);
}
function computeReadiness(siteId){
  const reqs = state.requirements[siteId] || [];
  const items = reqs.map(req=>{
    const doc = state.documents[req.id] || {status:'missing'};
    return {req, doc, status: effectiveStatus(doc)};
  });
  const total = items.length;
  const counts = {complete:0, missing:0, expiring:0, expired:0, awaiting_review:0, correction_required:0};
  items.forEach(it=> counts[it.status] = (counts[it.status]||0)+1 );
  const percent = total? Math.round((counts.complete/total)*100) : 0;
  return {items, total, counts, percent};
}
function siteSubmissionStatus(siteId){
  const {counts, total} = computeReadiness(siteId);
  if(!total) return 'no_requirements';
  if(counts.correction_required || counts.expired) return 'changes_required';
  if(counts.awaiting_review) return 'under_review';
  if(counts.missing===0 && counts.expiring===0) return 'ready_to_approve';
  return 'in_progress';
}
function gaugeColor(pct){
  if(pct>=90) return 'var(--green)';
  if(pct>=60) return 'var(--orange)';
  return 'var(--red)';
}
function gauge(pct, size){
  size = size||52;
  const r=(size-8)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  const col=gaugeColor(pct);
  return '<div class="gauge" style="width:'+size+'px;height:'+size+'px;">'
    +'<svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--grey-line)" stroke-width="4"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg>'
    +'<span style="color:'+col+'">'+pct+'%</span></div>';
}
function badge(status){
  return '<span class="badge '+status+'"><dot></dot>'+STATUS_LABEL[status]+'</span>';
}
function timeAgo(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});
}

function submitRequirement(reqId, note, expiryDate){
  const existing = state.documents[reqId] || {};
  if(!existing.assetId){ showToast('Attach a file before submitting'); return; }
  const wasCorrection = existing.status==='correction_required' || effectiveStatus(existing)==='expired';
  const nextVersion = existing.version ? bumpVersion(existing.version) : 'v1.0';
  const history = (existing.history || []).slice();
  if(existing.version && existing.assetId) history.push({version:existing.version, assetId:existing.assetId, assetUrl:existing.assetUrl, assetName:existing.assetName, updatedAt:existing.updatedAt, note:existing.note});
  state.documents[reqId] = Object.assign({}, existing, {status:'awaiting_review', version:nextVersion, updatedAt:new Date().toISOString().slice(0,10), note: note||existing.note, expiryDate: expiryDate||existing.expiryDate||null, history});
  const req = findReq(reqId);
  logAudit(wasCorrection? 'Resubmitted document' : 'Submitted document', req.name+' ('+nextVersion+')', siteIdForReq(reqId));
  persist();
  showToast('Submitted for review');
}
async function callAI(prompt, opts){
  opts = opts || {};
  if(sampleCap){
    return await sampleCap(prompt, opts);
  }
  if(!apiKey) throw new Error('no_key');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model:'claude-sonnet-4-5-20250929', max_tokens:1500, messages:[{role:'user', content:prompt}] })
  });
  if(!res.ok){
    const errBody = await res.json().catch(()=>null);
    throw new Error((errBody && errBody.error && errBody.error.message) || ('API error '+res.status));
  }
  const data = await res.json();
  const text = (data.content||[]).map(c=>c.text||'').join('');
  if(opts.onText) opts.onText({text});
  return {text};
}
async function tryExtractExpiry(file){
  try{
    if(!file.type || !file.type.startsWith('image/')) return null;
    const sampleCap = await claude.use('sample');
    if(!sampleCap) return null;
    const caps = await sampleCap.limits().catch(()=>null);
    if(!caps || !caps.images) return null;
    const result = await sampleCap.json(
      'This photo is a compliance document (a certificate, licence, ID, medical, or inspection tag). If it shows an expiry, valid-until, or renewal date, reply with only {"expiryDate":"YYYY-MM-DD"}. If no such date is visible, reply with only {"expiryDate":null}.',
      { images:file, modelTier:'quick', cache:false }
    );
    if(result && result.expiryDate && /^\d{4}-\d{2}-\d{2}$/.test(result.expiryDate)) return result.expiryDate;
    return null;
  }catch(e){ return null; }
}
async function attachFileToReq(reqId, file){
  if(!assetsCap){ showToast('File attachments aren\'t available in this view'); return; }
  if(file.size > 20*1024*1024){ showToast('File is too large (20MB max)'); return; }
  showToast('Uploading…');
  try{
    const asset = await assetsCap.upload(file);
    const existing = state.documents[reqId] || {status:'missing'};
    state.documents[reqId] = Object.assign({}, existing, {assetId:asset.id, assetUrl:asset.url, assetName:file.name, assetType:asset.contentType});
    persist();
    refreshOpenSheet(reqId);
    showToast('File attached — scanning for an expiry date…');
    const detected = await tryExtractExpiry(file);
    if(detected){
      state.documents[reqId].expiryDate = detected;
      persist();
      const expiryField = document.getElementById('expiryInput');
      if(expiryField) expiryField.value = detected;
      const note = document.getElementById('expiryDetected');
      if(note) note.textContent = 'Expiry detected: '+timeAgo(detected);
      showToast('Expiry date detected: '+timeAgo(detected));
    }
  }catch(e){
    showToast('Upload failed — try again');
  }
}

function bumpVersion(v){
  const m = v.match(/v(\d+)\.(\d+)/);

const LIBRARY_TYPES = [
  {id:'good-standing', category:'Company Documents', name:'Letter of Good Standing (COID)', source:'legal', why:'Reusable across every site — most sites require this before work starts.'},
  {id:'insurance', category:'Company Documents', name:'Public liability insurance', source:'client', why:'Most sites require at least R5m cover; keep one current copy here.'},
  {id:'she-policy', category:'Company Documents', name:'Health & Safety policy', source:'legal', why:'Required under the MHSA for every site you work on.'},

function libraryReqId(contractorId, typeId){ return 'lib:'+contractorId+':'+typeId; }
function findReq(reqId){
  if(reqId && reqId.indexOf('lib:')===0){
    const typeId = reqId.split(':')[2];
    const t = LIBRARY_TYPES.find(x=>x.id===typeId);
    return t ? Object.assign({id:reqId}, t) : null;
  }

function bottomNav(){

/* ============ RENDER: VIEWS ============ */
function renderView(){
  if(nav==='dashboard') return renderDashboard();
  if(nav==='sites') return activeSiteId ? renderSiteDetail(activeSiteId) : renderSitesList();
  if(nav==='passport') return role==='contractor' ? renderPassport() : renderContractorsList();
  if(nav==='audit') return renderAudit();
  if(nav==='verify') return renderVerify();
  return '';
}

}

    +attnCard('blue', sites.length, 'Sites')
    +attnCard('green', contractors.length, 'Contractors')

  +'</div>'
  +'<div class="section-title">Site portfolio</div>'
  + (sites.length ? sites.map(portfolioRow).join('') : '<div class="empty"><h3>No sites yet</h3><p>Add your first site to start tracking contractor compliance.</p></div>')
  +'<div class="section-title">Pending invitations</div>'
  + renderPendingInvitations()
  + renderAISettings()
  + renderIntegrationSettings()
  + renderSecurityPanel()
  +'<div class="section-title">Data</div>'
  +'<div class="card"><div class="site-card-sub" style="margin-bottom:10px;">'+(isDemoMode()?'You\'re viewing sample data — nothing here is real. Reset to start entering your own organisation.':'This is your real organisation\'s data.')+'</div>'
  + (isDemoMode()

  +'</div>'
  +'<div class="section-title">Not yet in this build</div>'

      +'<div class="reqrow-meta"><span class="badge blue">Pending</span><span class="srctag">'+(site?site.name:'')+' · sent '+timeAgo(inv.sentAt)+'</span></div></div></div>';

function renderSecurityPanel(){
  return '<div class="section-title">Security &amp; production readiness</div>'
  +'<div class="card">'
  +'<div class="site-card-sub" style="margin-bottom:8px;"><strong style="color:var(--ink);">What\'s real today:</strong> your identity comes from your actual claude.ai sign-in — there is no separate SiteGuard password to leak. Every document, site and audit entry lives inside this organisation\'s own private data store; nothing here is a public URL. The role switcher above is a <em>demo control</em> for trialling every perspective in one sitting — it is not how production access will work.</div>'

function attnCard(color, num, label, taskFilter){

function portfolioRow(site){

  const pct = site.status==='site_ready' ? 100 : percent;
  const sub = site.status==='site_ready' ? 'Site Ready · '+contractor.name
    : site.status==='invited' ? contractor.name+' · Invitation pending'
    : site.status==='declined' ? contractor.name+' · Invitation declined'
    : contractor.name+' · '+statusLabelForSubmission(siteSubmissionStatus(site.id));

    +'<div class="portfolio-top"><span class="portfolio-name">'+site.name+'</span><span class="portfolio-pct" style="color:'+(site.status==='invited'?'var(--blue)':gaugeColor(pct))+';">'+(site.status==='invited'?'Invited':pct+'%')+'</span></div>'
    +'<div class="portfolio-track"><div class="portfolio-fill" style="width:'+(site.status==='invited'?0:pct)+'%;background:'+gaugeColor(pct)+';"></div></div>'
    +'<div class="portfolio-sub">'+sub+'</div></div>'
    +'<div class="site-card-arrow">'+ICONS.chevron+'</div></div>';
}
function statusLabelForSubmission(s){
  return {changes_required:'Changes required', under_review:'Under review', ready_to_approve:'Ready to approve', in_progress:'In progress', no_requirements:'No requirements set yet'}[s]||s;
}

function renderSitesList(){
  const sites = role==='contractor' ? Object.values(state.sites).filter(s=>s.contractorId===myContractorId()) : Object.values(state.sites);
  return '<div class="view-head"><h1>Sites</h1><p>'+sites.length+' site'+(sites.length===1?'':'s')+'</p></div>' + sites.map(portfolioRow).join('');
}

function renderSiteDetail(siteId){
  const site = state.sites[siteId];
  const contractor = state.contractors[site.contractorId];

  if(role==='contractor' && site.status==='invited'){
    const inv = Object.values(state.invitations||{}).find(i=>i.siteId===siteId && i.status==='pending');
    return '<div style="margin-bottom:14px;"><button class="btn secondary small" data-back-sites="1">← Sites</button></div>'
      +'<div class="view-head"><h1>You\'re invited</h1><p>'+site.name+'</p></div>'
      +'<div class="card checkpoint">'
      +'<div class="site-card-title">'+site.name+'</div>'
      +'<div class="site-card-sub" style="margin-top:6px;">'+site.location+'</div>'
      +'<div class="site-card-sub" style="margin-top:10px;">'+contractor.name+' has been invited to work this site and submit a safety file. Accepting will show you the requirements and start tracking readiness; declining removes it from your list.</div>'
      +'<div style="display:flex;gap:8px;margin-top:14px;">'
      +'<button class="btn orange" style="flex:1;" data-accept-invite="'+(inv?inv.id:'')+'">Accept</button>'
      +'<button class="btn secondary" style="flex:1;" data-decline-invite="'+(inv?inv.id:'')+'">Decline</button>'
      +'</div></div>';
  }

  let html = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;justify-content:space-between;">'
    +'<button class="btn secondary small" data-back-sites="1">← Sites</button>'
    +'<div style="display:flex;gap:6px;">'
    +'<button class="btn danger small icon" data-emergency-site="'+siteId+'" title="Emergency info">'+ICONS.emergency+'</button>'
    +'<button class="btn secondary small" data-export-site="'+siteId+'">Export</button></div></div>'
    +'<div class="view-head"><h1>'+site.name+'</h1><p>'+site.location+' · '+contractor.name+'</p></div>'
    +'<div class="subtabs">'
      +'<button data-sitetab="compliance" class="'+(siteTab==='compliance'?'active':'')+'">Compliance</button>'
      +'<button data-sitetab="activity" class="'+(siteTab==='activity'?'active':'')+'">Site activity</button>'
    +'</div>';

  if(siteTab==='activity'){
    return html + renderSiteActivity(siteId);
  }

  const {items, total, counts, percent} = computeReadiness(siteId);
  const submission = siteSubmissionStatus(siteId);
  const safetyBlocksApproval = openSafetyIssues(siteId).severeIncidents.length>0;
  const canApprove = role==='reviewer' && submission==='ready_to_approve' && site.status!=='site_ready' && !safetyBlocksApproval;
  const approval = state.approvals[siteId];

  if(site.status==='invited' && role!=='contractor'){
    const inv = Object.values(state.invitations||{}).find(i=>i.siteId===siteId && i.status==='pending');
    html += '<div class="card checkpoint" style="margin-top:12px;"><div class="flexbetween"><div>'
      +'<div class="site-card-title" style="font-size:14px;">Awaiting contractor response</div>'
      +'<div class="site-card-sub">'+contractor.name+' was invited '+(inv?timeAgo(inv.sentAt):'')+' and hasn\'t accepted yet. Requirements are visible below but the contractor can\'t submit against them until they accept.</div>'
      +'</div><span class="badge blue">Pending</span></div></div>';
  } else if(site.status==='declined' && role!=='contractor'){
    html += '<div class="card checkpoint" style="margin-top:12px;border-color:var(--red);"><div class="site-card-title" style="font-size:14px;">Invitation declined</div>'
      +'<div class="site-card-sub">'+contractor.name+' declined this invitation. Assign a different contractor or follow up directly.</div></div>';
  }

  const grouped = {};
  items.forEach(it=>{ (grouped[it.req.category] = grouped[it.req.category]||[]).push(it); });

  const safety = openSafetyIssues(siteId);
  if(safety.count){
    html += '<div class="notice" style="background:var(--red-bg);color:var(--red);cursor:pointer;" data-sitetab="activity">'
      + safety.incidents.length+' open incident'+(safety.incidents.length===1?'':'s')+(safety.expiredPermits.length?' · '+safety.expiredPermits.length+' expired permit'+(safety.expiredPermits.length===1?'':'s')+' not closed out':'')
      + ' — see Site activity'
      + (safety.severeIncidents.length ? ' (includes a lost time injury or fatality)' : '')
      +'</div>';
  }

  if(site.status==='site_ready' && approval){
    html += '<div class="card checkpoint" style="border-color:var(--green);">'
      +'<div class="badge approved" style="margin-bottom:8px;">'+ICONS.check+'Site Ready</div>'
      +'<div class="site-card-sub">Approved by '+approval.approver+', '+approval.role+' · '+timeAgo(approval.date)+' · '+approval.version+'</div>'
      +'<button class="btn secondary small" style="margin-top:10px;" data-goto-verify="'+siteId+'">View verification</button>'
      +'</div>';
  } else if(submission==='no_requirements'){
    html += '<div class="empty"><h3>No requirements set for this site</h3><p>'+(role==='contractor'?'The site hasn\'t defined what\'s required yet — check back soon.':'Add requirements when you create a site, or copy them from an existing one. There\'s nothing for '+contractor.name+' to submit against yet.')+'</p></div>';
  } else {
    html += '<div class="card checkpoint readiness-hero">'
      + gauge(percent, 78)
      +'<div><div class="site-card-title">Site Readiness</div>'
      +'<div class="site-card-sub">'+(counts.complete||0)+' of '+total+' requirements complete</div>'
      +'<div class="why-link" data-why="'+siteId+'">Why '+percent+'%?</div></div></div>';

    if(submission==='changes_required') html += '<div class="notice" style="background:var(--red-bg);color:var(--red);">'+(counts.correction_required)+' item(s) need corrections before this site can be resubmitted.</div>';
    else if(submission==='under_review') html += '<div class="notice">'+(counts.awaiting_review)+' item(s) awaiting reviewer sign-off.</div>';
    else if(submission==='ready_to_approve' && safetyBlocksApproval) html += '<div class="notice" style="background:var(--red-bg);color:var(--red);">All requirements complete, but this site can\'t be marked Ready while a lost time injury or fatality investigation is still open.</div>';
    else if(submission==='ready_to_approve' && role!=='reviewer') html += '<div class="notice" style="background:var(--green-bg);color:var(--green);">All requirements complete — waiting on final site approval.</div>';

    if(canApprove){
      html += '<button class="btn orange block" data-approve-site="'+siteId+'" style="margin-bottom:14px;">Approve — Mark Site Ready</button>';
    }
  }

  Object.keys(grouped).forEach(cat=>{
    html += '<div class="section-title">'+cat+'</div><div class="card">';
    grouped[cat].forEach(it=>{
      html += '<div class="reqrow" data-open-req="'+it.req.id+'"><div class="reqrow-main">'
        +'<div class="reqrow-name">'+it.req.name+'</div>'
        +'<div class="reqrow-meta">'+badge(it.status)+'<span class="srctag">'+SOURCE_LABEL[it.req.source]+'</span></div>'
        +'</div><div class="reqrow-chevron">'+ICONS.chevron+'</div></div>';
    });
    html += '</div>';
  });

  return html;
}

const INCIDENT_TYPES = [
  {id:'near_miss', label:'Near miss', color:'var(--blue)'},
  {id:'first_aid', label:'First aid case', color:'var(--amber)'},
  {id:'medical_treatment', label:'Medical treatment case', color:'var(--amber)'},
  {id:'lost_time', label:'Lost time injury', color:'var(--red)'},
  {id:'fatality', label:'Fatality', color:'var(--red)'},
  {id:'property_damage', label:'Property damage', color:'var(--grey)'},
  {id:'environmental', label:'Environmental incident', color:'var(--amber)'},
];
function incidentTypeInfo(id){ return INCIDENT_TYPES.find(t=>t.id===id) || {label:id, color:'var(--grey)'}; }
const PERMIT_TYPES = [
  {id:'hot_work', label:'Hot work'},
  {id:'heights', label:'Working at heights'},
  {id:'confined_space', label:'Confined space entry'},
  {id:'excavation', label:'Excavation'},
  {id:'lifting', label:'Lifting operation'},
  {id:'electrical_isolation', label:'Electrical isolation / LOTO'},
];
function permitTypeInfo(id){ return PERMIT_TYPES.find(t=>t.id===id) || {label:id}; }
function permitEffectiveStatus(p){
  if(p.status==='closed') return 'closed';
  if(p.status==='pending') return 'pending';
  if(p.validTo && p.validTo < new Date().toISOString()) return 'expired';
  return 'active';
}
function permitBadge(status){
  const map = { active:['complete','Active'], pending:['awaiting_review','Pending issue'], expired:['expired','Expired — close out'], closed:['complete','Closed'] };
  const [cls,label] = map[status] || ['missing', status];
  return '<span class="badge '+cls+'">'+(cls==='complete'?ICONS.check:'')+label+'</span>';
}
function renderSiteActivity(siteId){
  const permits = (state.permits && state.permits[siteId]) || [];
  let html = '<div class="section-title">Permit to work register</div>';
  html += '<button class="btn orange block" data-new-permit="'+siteId+'" style="margin-bottom:10px;">'+(role==='contractor'?'Request a permit':'Issue a permit')+'</button>';
  if(!permits.length){
    html += '<div class="card"><div class="site-card-sub">No permits raised for this site. High-risk work — hot work, heights, confined space, excavation, lifting, electrical isolation — should have one before it starts.</div></div>';
  } else {
    html += '<div class="card">' + permits.map(p=>renderPermitRow(p, siteId)).join('') + '</div>';
  }

  const incidents = (state.incidents && state.incidents[siteId]) || [];
  html += '<div class="section-title">Incident register</div>';
  html += '<button class="btn danger block" data-report-incident="'+siteId+'" style="margin-bottom:10px;">Report an incident</button>';
  if(!incidents.length){
    html += '<div class="card"><div class="site-card-sub">No incidents logged for this site. Near misses count too — logging them is how patterns get caught before someone gets hurt.</div></div>';
  } else {
    html += '<div class="card">' + incidents.map(inc=>renderIncidentRow(inc, siteId)).join('') + '</div>';
  }

  const diary = state.diary[siteId]||[];
  html += '<div class="section-title">Daily site diary</div>';
  html += '<button class="btn secondary block" data-new-diary="'+siteId+'" style="margin-bottom:10px;">+ Log today\'s entry</button>';
  if(!diary.length){
    html += '<div class="card"><div class="site-card-sub">No diary entries yet.</div></div>';
  } else {
    html += '<div class="card">' + diary.slice(0,6).map(renderDiaryRow).join('') + '</div>';
  }

  html += '<div class="section-title">Inspections &amp; corrective actions</div>';
  const list = (state.inspections[siteId]||[]);
  if(role!=='contractor'){
    html += '<button class="btn orange block" data-new-inspection="'+siteId+'" style="margin-bottom:14px;">Log inspection</button>';
  }
  if(!list.length){
    html += '<div class="empty"><h3>No inspections logged yet</h3><p>Scheduled inspections, spot checks and toolbox talks will appear here.</p></div>';
    return html;
  }
  list.forEach(insp=>{
    const openDefects = insp.defects.filter(d=>d.status!=='verified').length;

function renderReqSheet(reqId){
  const req = findReq(reqId);
  const doc = state.documents[reqId] || {status:'missing'};
  const eff = effectiveStatus(doc);
  const thread = state.reviews[reqId] || [];
  const isMine = role==='contractor';
  const isReviewer = role==='reviewer';

  let body = '<div class="sheet-head"><div><h3>'+req.name+'</h3><div class="site-card-sub">'+req.category+'</div></div><button class="sheet-close" data-close-sheet="1">'+ICONS.cross+'</button></div>';
  body += '<div style="margin:10px 0;">'+badge(eff)+' <span class="srctag" style="margin-left:6px;">'+SOURCE_LABEL[req.source]+'</span></div>';
  body += '<p style="font-size:13.5px;color:var(--ink-soft);">'+req.why+'</p>';

  if(doc.version){
    body += '<div class="divider"></div><div class="site-card-sub">Version '+doc.version+' · updated '+timeAgo(doc.updatedAt)+'</div>';
    if(doc.expiryDate) body += '<div class="site-card-sub">'+(eff==='expired'?'Expired ':'Expires ')+timeAgo(doc.expiryDate)+'</div>';
    if(doc.note) body += '<div class="site-card-sub" style="margin-top:4px;">'+doc.note+'</div>';
  }
  if(doc.assetUrl){
    body += '<div class="card checkpoint" style="margin-top:10px;display:flex;align-items:center;justify-content:space-between;">'
      +'<span style="font-size:13px;">📎 '+doc.assetName+'</span>'
      +'<a class="btn secondary small" href="'+doc.assetUrl+'" target="_blank" rel="noopener">View</a></div>';
  }
  if(doc.history && doc.history.length){
    body += '<details style="margin-top:8px;"><summary style="font-size:12.5px;color:var(--grey);cursor:pointer;">Version history ('+doc.history.length+' earlier)</summary>'
      + doc.history.slice().reverse().map(h=>'<div class="reqrow" style="padding:8px 0;"><div class="reqrow-main"><div class="reqrow-name" style="font-size:13px;">'+h.version+'</div>'
        +'<div class="reqrow-meta">'+(h.updatedAt||'')+(h.note?' · '+h.note:'')+(h.assetUrl?' · <a href="'+h.assetUrl+'" target="_blank" rel="noopener">view</a>':'')+'</div></div></div>').join('')
      +'</details>';
  }

  if(thread.length){
    body += '<div class="thread">';
    thread.forEach(t=>{
      body += '<div class="thread-item"><div class="thread-who">'+t.author+' <span class="thread-role">· '+t.role+'</span></div>'
        +'<div class="thread-text">'+t.text+'</div><div class="thread-ts">'+timeAgo(t.ts)+'</div></div>';
    });
    body += '</div>';
  }

  body += '<div class="divider"></div>';

  if(isMine){
    if(eff==='missing' || eff==='correction_required' || eff==='expired'){
      body += '<label class="field-label">Attach file'+(assetsCap?'':' (not available in this view)')+'</label>'
        +'<input type="file" id="fileInput" accept="image/*,.pdf" data-attach-req="'+reqId+'" '+(assetsCap?'':'disabled')+' style="font-size:12.5px;">'
        +'<div class="site-card-sub" style="margin-top:3px;">Photos of certificates/licences are scanned automatically for an expiry date.</div>'
        +'<div class="site-card-sub" id="expiryDetected" style="margin-top:4px;"></div>'
        +'<label class="field-label">Expiry date (auto-detected where possible)</label><input type="date" id="expiryInput" value="'+(doc.expiryDate||'')+'">'
        +'<label class="field-label">Notes (optional)</label><textarea id="submitNote" placeholder="Add any context for the reviewer…"></textarea>'
        +'<button class="btn orange block" style="margin-top:10px;" data-submit-req="'+reqId+'">'+(eff==='missing'?'Submit for review':'Resubmit')+'</button>';
    } else if(eff==='expiring'){
      body += '<label class="field-label">New expiry date</label><input type="date" id="renewExpiry" value="'+(doc.expiryDate||'')+'">'
        +'<button class="btn secondary block" style="margin-top:8px;" data-renew-req="'+reqId+'">Mark as renewed</button>';
    } else if(eff==='awaiting_review'){
      body += '<p class="site-card-sub">Submitted — waiting on reviewer sign-off.</p>';
    } else {
      body += '<p class="site-card-sub">This requirement is complete.</p>';
    }
  } else if(isReviewer){
    if(eff==='awaiting_review' || eff==='correction_required'){
      body += '<button class="btn orange block" data-approve-req="'+reqId+'" style="margin-bottom:8px;">Approve</button>'
        +'<label class="field-label">Request correction</label><textarea id="correctionNote" placeholder="What needs to change?"></textarea>'
        +'<button class="btn secondary block" style="margin-top:8px;" data-correct-req="'+reqId+'">Request correction</button>';
    } else if(eff==='missing'){
      body += '<p class="site-card-sub">Not yet submitted by the contractor.</p>';
    } else if(eff==='expired'){
      body += '<p class="site-card-sub">This document has lapsed — the contractor needs to resubmit a current copy before it counts toward readiness again.</p>';
    } else {
      body += '<p class="site-card-sub">This requirement is complete.</p>';
    }
  } else {
    body += '<p class="site-card-sub">Viewing only — admin accounts don\'t action individual requirements.</p>';
  }

  return body;
}

function computeTasks(){
  const tasks = [];
  const relevantSites = (role==='contractor' ? Object.values(state.sites).filter(s=>s.contractorId===myContractorId()) : Object.values(state.sites)).filter(s=>s.status!=='invited' && s.status!=='declined');
  relevantSites.forEach(site=>{
    (state.requirements[site.id]||[]).forEach(req=>{
      const doc = state.documents[req.id] || {status:'missing'};
      const eff = effectiveStatus(doc);
      if(eff==='expired') tasks.push({priority:'high', title:req.name+' has expired', sub:site.name, reqId:req.id, siteId:site.id});
      else if(eff==='correction_required') tasks.push({priority:'high', title:'Correction needed: '+req.name, sub:site.name, reqId:req.id, siteId:site.id});
      else if(eff==='missing' && role!=='contractor') tasks.push({priority:'high', title:req.name+' not yet submitted', sub:site.name+' · '+state.contractors[site.contractorId].name, reqId:req.id, siteId:site.id});
      else if(eff==='expiring') tasks.push({priority:'medium', title:req.name+' expires '+timeAgo(doc.expiryDate), sub:site.name, reqId:req.id, siteId:site.id});
      else if(eff==='complete' && doc.expiryDate){
        const days = daysUntil(doc.expiryDate);
        if(days!==null && days>30 && days<=60) tasks.push({priority:'low', title:req.name+' renews in about '+days+' days', sub:site.name+' · get ahead of it', reqId:req.id, siteId:site.id});
      }
    });
  });
  relevantSites.forEach(site=>{
    (state.incidents[site.id]||[]).forEach(inc=>{
      if(inc.status==='closed') return;
      const t = incidentTypeInfo(inc.type);
      const severe = inc.type==='lost_time' || inc.type==='fatality';
      tasks.push({priority: severe?'high':'medium', title:(inc.status==='investigating'?'Continue investigation: ':'Investigate: ')+t.label, sub:site.name+' · reported '+timeAgo(inc.date), incidentId:inc.id, siteId:site.id});
    });
  });
  relevantSites.forEach(site=>{
    ((state.permits && state.permits[site.id]) || []).forEach(p=>{
      const eff = permitEffectiveStatus(p);
      if(eff==='closed') return;
      const t = permitTypeInfo(p.type);
      if(eff==='pending' && role!=='contractor') tasks.push({priority:'medium', title:'Issue permit: '+t.label, sub:site.name+' · '+p.location, permitId:p.id, siteId:site.id});
      else if(eff==='expired') tasks.push({priority:'high', title:'Expired permit needs closing: '+t.label, sub:site.name+' · '+p.location, permitId:p.id, siteId:site.id});
    });
  });
  if(role==='contractor'){
    LIBRARY_TYPES.forEach(t=>{
      const reqId = libraryReqId(myContractorId(), t.id);
      const doc = state.documents[reqId] || {status:'missing'};
      const eff = effectiveStatus(doc);
      if(eff==='expired') tasks.push({priority:'high', title:t.name+' has expired', sub:'Document library', reqId, siteId:null});
      else if(eff==='expiring') tasks.push({priority:'medium', title:t.name+' expires '+timeAgo(doc.expiryDate), sub:'Document library', reqId, siteId:null});
    });
  }
  Object.values(state.requests||{}).forEach(req=>{
    if(role==='contractor'){
      if(req.contractorId!==myContractorId() || req.status==='completed') return;
      const overdue = req.dueDate && req.dueDate < todayStr();
      tasks.push({priority: overdue?'high':'medium', title:req.title+(overdue?' — overdue':''), sub:state.sites[req.siteId].name+' · requested by '+req.requestedBy, requestId:req.id, siteId:req.siteId});
    } else {
      if(req.status!=='submitted') return;
      tasks.push({priority:'medium', title:'Review response: '+req.title, sub:state.contractors[req.contractorId].name, requestId:req.id, siteId:req.siteId});
    }
  });
  const order = {high:0, medium:1, low:2};
  return tasks.sort((a,b)=>order[a.priority]-order[b.priority]);
}
function renderTasksSheet(filter){
  let tasks = computeTasks();
  if(filter && filter!=='all') tasks = tasks.filter(t=>t.priority===filter);
  const label = {high:'Needs attention now', medium:'Coming up', low:'Stay ahead', all:'All tasks'}[filter||'all'];
  let body = '<div class="sheet-head"><div><h3>'+label+'</h3><div class="site-card-sub">'+tasks.length+' item'+(tasks.length===1?'':'s')+'</div></div><button class="sheet-close" data-close-sheet="1">'+ICONS.cross+'</button></div>';

  const dotColor = {high:'var(--red)', medium:'var(--amber)', low:'var(--green)'};

  return body;
}

function runSearch(q){
  q = q.trim().toLowerCase();
  if(q.length<2) return [];
  const results = [];
  Object.values(state.sites).forEach(s=>{
    if(role==='contractor' && s.contractorId!==myContractorId()) return;
    if(s.name.toLowerCase().indexOf(q)>=0 || s.location.toLowerCase().indexOf(q)>=0) results.push({type:'Site', title:s.name, sub:s.location, siteId:s.id});
    (state.requirements[s.id]||[]).forEach(req=>{
      if(req.name.toLowerCase().indexOf(q)>=0) results.push({type:'Document', title:req.name, sub:s.name, siteId:s.id, reqId:req.id});
    });
  });
  Object.values(state.requests||{}).forEach(rq=>{
    if(role==='contractor' && rq.contractorId!==myContractorId()) return;
    if(rq.title.toLowerCase().indexOf(q)>=0) results.push({type:'Request', title:rq.title, sub:state.sites[rq.siteId].name, requestId:rq.id});
  });
  if(role!=='contractor'){
    Object.values(state.contractors).forEach(c=>{
      if(c.name.toLowerCase().indexOf(q)>=0) results.push({type:'Contractor', title:c.name, sub:c.trade||'Contractor', contractorId:c.id});
    });
  } else {
    LIBRARY_TYPES.forEach(t=>{
      if(t.name.toLowerCase().indexOf(q)>=0) results.push({type:'Document', title:t.name, sub:'Document library', reqId:libraryReqId(myContractorId(), t.id)});
    });
  }
  return results.slice(0,20);
}

function qrGlyph(seed){
  // deterministic pseudo-QR pattern for visual flavor only
  let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  let cells='';
  for(let y=0;y<7;y++){ for(let x=0;x<7;x++){
    h=(h*1103515245+12345)>>>0;
    const on = (h>>16)%3!==0;
    const corner=(x<2&&y<2)||(x>4&&y<2)||(x<2&&y>4);
    cells += '<rect x="'+(x*14+4)+'" y="'+(y*14+4)+'" width="12" height="12" fill="'+((on||corner)?'#111':'transparent')+'"/>';
  }}
  return '<svg width="102" height="102" viewBox="0 0 106 106">'+cells+'</svg>';
}

  document.body.appendChild(overlay);
  wireSheetEvents(overlay);
}
function closeSheet(){
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
}
function wireSheetEvents(scope){
  const close = scope.querySelector('[data-close-sheet]');
  if(close) close.onclick = closeSheet;
  scope.querySelectorAll('[data-task-goto]').forEach(el=>el.onclick=()=>{
    const reqId = el.getAttribute('data-task-goto');
    const requestId = el.getAttribute('data-task-request');
    const incidentId = el.getAttribute('data-task-incident');
    const permitId = el.getAttribute('data-task-permit');
    const siteId = el.getAttribute('data-task-site');
    closeSheet();
    if(requestId){ openSheet(renderRequestDetailSheet(requestId)); return; }
    if(incidentId){ openSheet(renderIncidentDetailSheet(siteId, incidentId)); return; }
    if(permitId){ openSheet(renderPermitDetailSheet(siteId, permitId)); return; }
    if(!reqId) return;
    if(siteId){ activeSiteId = siteId; nav='sites'; siteTab='compliance'; render(); }
    else { nav='passport'; render(); }
    openReq = reqId; openSheet(renderReqSheet(reqId));
  });
  const searchInput = scope.querySelector('#searchInput');
  if(searchInput) searchInput.oninput = ()=>{
    const results = runSearch(searchInput.value);
    const box = scope.querySelector('#searchResults');
    if(!box) return;
    if(!searchInput.value.trim()) box.innerHTML = '';
    else if(!results.length) box.innerHTML = '<div class="site-card-sub" style="padding:8px 2px;">No matches</div>';
    else box.innerHTML = results.map((r,i)=>'<button class="qa-item" data-search-result="'+i+'">'
      +'<div class="qa-icon">'+(r.type==='Site'?ICONS.sites:r.type==='Contractor'?ICONS.passport:ICONS.audit)+'</div>'
      +'<div><div class="qa-title">'+r.title+'</div><div class="qa-sub">'+r.type+' · '+r.sub+'</div></div></button>').join('');
    box.querySelectorAll('[data-search-result]').forEach(btn=>btn.onclick=()=>{
      const r = results[parseInt(btn.getAttribute('data-search-result'),10)];
      closeSheet();
      if(r.requestId){ openSheet(renderRequestDetailSheet(r.requestId)); }
      else if(r.reqId){
        if(r.siteId){ activeSiteId=r.siteId; nav='sites'; siteTab='compliance'; render(); } else { nav='passport'; render(); }
        openReq = r.reqId; openSheet(renderReqSheet(r.reqId));
      } else if(r.siteId){ activeSiteId=r.siteId; nav='sites'; siteTab='compliance'; render(); }
      else if(r.contractorId){ nav='passport'; render(); }
    });
  };
  const fileInput = scope.querySelector('[data-attach-req]');
  if(fileInput) fileInput.onchange = (e)=>{
    const f = e.target.files[0];
    if(f) attachFileToReq(fileInput.getAttribute('data-attach-req'), f);
  };
  const submitBtn = scope.querySelector('[data-submit-req]');
  if(submitBtn) submitBtn.onclick = ()=>{
    const note = scope.querySelector('#submitNote');
    const expiry = scope.querySelector('#expiryInput');
    submitRequirement(submitBtn.getAttribute('data-submit-req'), note?note.value:'', expiry?expiry.value:'');
    closeSheet();
  };
  const renewBtn = scope.querySelector('[data-renew-req]');
  if(renewBtn) renewBtn.onclick = ()=>{
    const exp = scope.querySelector('#renewExpiry');
    renewExpiring(renewBtn.getAttribute('data-renew-req'), exp?exp.value:'');
    closeSheet();
  };
  const approveBtn = scope.querySelector('[data-approve-req]');
  if(approveBtn) approveBtn.onclick = ()=>{ reviewerApprove(approveBtn.getAttribute('data-approve-req')); closeSheet(); };
  const correctBtn = scope.querySelector('[data-correct-req]');
  if(correctBtn) correctBtn.onclick = ()=>{
    const text = scope.querySelector('#correctionNote');
    if(!text || !text.value.trim()){ text.focus(); return; }
    reviewerRequestCorrection(correctBtn.getAttribute('data-correct-req'), text.value.trim());
    closeSheet();
  };
  const saveInspBtn = scope.querySelector('[data-save-inspection]');
  if(saveInspBtn) saveInspBtn.onclick = ()=>{
    const title = scope.querySelector('#inspTitle').value.trim();
    const type = scope.querySelector('#inspType').value.trim();
    if(!title){ scope.querySelector('#inspTitle').focus(); return; }
    createInspection(saveInspBtn.getAttribute('data-save-inspection'), {title, type:type||'Inspection'});
    closeSheet();
  };
  const saveDefBtn = scope.querySelector('[data-save-defect]');
  if(saveDefBtn) saveDefBtn.onclick = ()=>{
    const desc = scope.querySelector('#defDesc').value.trim();
    if(!desc){ scope.querySelector('#defDesc').focus(); return; }
    createDefect(saveDefBtn.getAttribute('data-save-defect'), saveDefBtn.getAttribute('data-insp'), {
      description:desc,
      severity:scope.querySelector('#defSev').value,
      assignedTo:scope.querySelector('#defAssignee').value.trim(),
      dueDate:scope.querySelector('#defDue').value || 'TBC',
    });
    closeSheet();
  };
  const incidentFlag = scope.querySelector('#diaryIncidentFlag');
  if(incidentFlag) incidentFlag.onchange = ()=>{
    const wrap = scope.querySelector('#diaryIncidentWrap');
    if(wrap) wrap.style.display = incidentFlag.checked ? 'block' : 'none';
  };
  const saveDiaryBtn = scope.querySelector('[data-save-diary]');
  if(saveDiaryBtn) saveDiaryBtn.onclick = ()=>{
    const summary = scope.querySelector('#diarySummary').value.trim();
    if(!summary){ scope.querySelector('#diarySummary').focus(); return; }
    const incident = scope.querySelector('#diaryIncidentFlag').checked;
    createDiaryEntry(saveDiaryBtn.getAttribute('data-save-diary'), {
      crew: parseInt(scope.querySelector('#diaryCrew').value)||0,
      weather: scope.querySelector('#diaryWeather').value.trim(),
      summary, incident,
      incidentNote: scope.querySelector('#diaryIncidentNote').value.trim(),
    });
    closeSheet();
  };
  scope.querySelectorAll('[data-qa]').forEach(btn=>btn.onclick=()=>{
    const action = btn.getAttribute('data-qa');
    const mySites = role==='contractor' ? Object.values(state.sites).filter(s=>s.contractorId===myContractorId() && s.status!=='invited' && s.status!=='declined') : Object.values(state.sites);
    closeSheet();
    if(action==='new-safety-file'){
      if(mySites.length===1){ activeSiteId=mySites[0].id; nav='sites'; siteTab='compliance'; render(); }
      else if(mySites.length>1){ openSheet(renderPickSiteSheet('safetyfile', mySites)); }
      else showToast('No sites yet — you\'ll see this once a site invites you.');
    } else if(action==='upload-c'){
      if(mySites.length===1){ activeSiteId=mySites[0].id; nav='sites'; siteTab='compliance'; render(); showToast('Tap a requirement to attach a file'); }
      else openSheet(renderPickSiteSheet('upload', mySites));
    } else if(action==='ai-draft'){
      openSheet(renderAIDraftSheet());
    } else if(action==='diary-c'){
      const sid = (focusSiteId && mySites.some(s=>s.id===focusSiteId)) ? focusSiteId : (mySites[0] && mySites[0].id);
      if(mySites.length<=1 && sid) openSheet(renderNewDiarySheet(sid));
      else if(sid) openSheet(renderNewDiarySheet(sid));
      else openSheet(renderPickSiteSheet('diary', mySites));
    } else if(action==='verify'){
      nav='verify'; activeSiteId=null; render();
    } else if(action==='add-site'){
      openSheet(renderNewSiteSheet());
    } else if(action==='inspection-r'){
      if(mySites.length===1) openSheet(renderNewInspectionSheet(mySites[0].id));
      else openSheet(renderPickSiteSheet('inspection', mySites));
    } else if(action==='request-doc'){
      if(mySites.length===1) openSheet(renderRequestSheet(mySites[0].id));
      else openSheet(renderPickSiteSheet('request', mySites));
    }
  });
  scope.querySelectorAll('[data-pick-site]').forEach(btn=>btn.onclick=()=>{
    const purpose = btn.getAttribute('data-pick-site');
    const siteId = btn.getAttribute('data-site');
    closeSheet();
    if(purpose==='diary') openSheet(renderNewDiarySheet(siteId));
    else if(purpose==='inspection') openSheet(renderNewInspectionSheet(siteId));
    else if(purpose==='upload'){ activeSiteId=siteId; nav='sites'; siteTab='compliance'; render(); showToast('Tap a requirement to attach a file'); }
    else if(purpose==='safetyfile'){ activeSiteId=siteId; nav='sites'; siteTab='compliance'; render(); }
    else if(purpose==='request'){ openSheet(renderRequestSheet(siteId)); }
  });
  const genBtn = scope.querySelector('[data-generate-draft]');
  if(genBtn) genBtn.onclick = async ()=>{
    const type = scope.querySelector('#draftType').value;
    const brief = scope.querySelector('#draftBrief').value.trim();
    const outputDiv = scope.querySelector('#draftOutput');
    genBtn.disabled = true; genBtn.textContent = 'Thinking…';
    outputDiv.innerHTML = '<div class="ai-output" id="draftText">Thinking…</div>';
    try{
      const c = state.contractors[myContractorId()];
      const companyLine = 'Company: '+(profile.company||c.name)+(profile.regNumber||c.reg?', Reg '+(profile.regNumber||c.reg):'')+(profile.coidNumber||c.coid?', COID '+(profile.coidNumber||c.coid):'')+(profile.address?', '+profile.address:'')+'. Prepared by: '+myName()+(profile.title?' ('+profile.title+')':'')+(profile.phone?', '+profile.phone:'')+(profile.email?', '+profile.email:'')+'.';
      const prompt = 'Draft a '+type+' for a South African mine site, for this job: '+(brief||'general site work')+'. '
        +companyLine+' Put a header block at the top with the company and preparer details above, then the document body.'
        +' Write a real working first draft a site supervisor could review and use, with clear headings, specific to relevant mining hazards (isolation/lock-out, working at heights, confined space, moving machinery, as applicable). Plain text with simple headings, no markdown symbols. State once at the end that this is a draft for review by a qualified person before use.';
      const result = await callAI(prompt, {
        modelTier:'default',
        onText: ({text})=>{ const el = document.getElementById('draftText'); if(el) el.textContent = text; }
      });
      outputDiv.innerHTML = '<div class="ai-output" id="draftText">'+escapeHtml(result.text)+'</div>'
        +'<label class="field-label">Save to library</label><select id="draftTarget" class="field">'+LIBRARY_TYPES.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('')+'</select>'
        +'<button class="btn secondary block" style="margin-top:8px;" data-save-draft="1">Save to library</button>';
      genBtn.style.display = 'none';
      wireSheetEvents(scope);
    }catch(e){
      outputDiv.innerHTML = '<p class="site-card-sub">Couldn\'t generate a draft right now'+(e && e.message && e.message!=='no_key' ? ' ('+escapeHtml(e.message)+')' : '')+'. Try again, or check your API key under Admin → AI settings.</p>';
      genBtn.disabled = false; genBtn.textContent = 'Generate draft';
    }
  };
  const saveDraftBtn = scope.querySelector('[data-save-draft]');
  if(saveDraftBtn) saveDraftBtn.onclick = async ()=>{
    if(!assetsCap){ showToast('Saving isn\'t available in this view'); return; }
    const textEl = scope.querySelector('#draftText');
    const targetSel = scope.querySelector('#draftTarget');
    const typeId = targetSel.value;
    const typeLabel = LIBRARY_TYPES.find(t=>t.id===typeId).name;
    const reqId = libraryReqId(myContractorId(), typeId);
    saveDraftBtn.disabled = true; saveDraftBtn.textContent = 'Saving…';
    try{
      const blob = new Blob([textEl.textContent], {type:'text/plain'});
      const asset = await assetsCap.upload(blob, {type:'text/plain'});
      const existing = state.documents[reqId] || {status:'missing'};
      state.documents[reqId] = Object.assign({}, existing, {assetId:asset.id, assetUrl:asset.url, assetName:typeLabel+' (AI draft).txt', assetType:asset.contentType, status:'awaiting_review', version: existing.version?bumpVersion(existing.version):'v1.0', updatedAt:new Date().toISOString().slice(0,10)});
      logAudit('Drafted document with AI', typeLabel);
      persist();
      showToast('Saved to your document library');
      closeSheet();
    }catch(e){
      showToast('Couldn\'t save — try again');
      saveDraftBtn.disabled = false; saveDraftBtn.textContent = 'Save to library';
    }
  };
  const savePermitBtn = scope.querySelector('[data-save-permit]');
  if(savePermitBtn) savePermitBtn.onclick = ()=>{
    const location = scope.querySelector('#permitLocation').value.trim();
    if(!location){ scope.querySelector('#permitLocation').focus(); return; }
    createPermit(savePermitBtn.getAttribute('data-save-permit'), {
      type: scope.querySelector('#permitType').value, location,
      description: scope.querySelector('#permitDescription').value.trim(),
      precautions: scope.querySelector('#permitPrecautions').value.trim(),
      issuedTo: scope.querySelector('#permitIssuedTo').value.trim(),
      validFrom: scope.querySelector('#permitFrom').value, validTo: scope.querySelector('#permitTo').value,
    });
    closeSheet(); render();
  };
  const issuePermitBtn = scope.querySelector('[data-issue-permit]');
  if(issuePermitBtn) issuePermitBtn.onclick = ()=>{
    issuePermit(issuePermitBtn.getAttribute('data-permit-site2'), issuePermitBtn.getAttribute('data-issue-permit'),
      scope.querySelector('#permitIssueFrom').value, scope.querySelector('#permitIssueTo').value);
    closeSheet(); render();
  };
  const closePermitBtn = scope.querySelector('[data-close-permit]');
  if(closePermitBtn) closePermitBtn.onclick = ()=>{
    closePermit(closePermitBtn.getAttribute('data-permit-site2'), closePermitBtn.getAttribute('data-close-permit'),
      scope.querySelector('#permitCloseNotes').value.trim());
    closeSheet(); render();
  };
  const saveIncBtn = scope.querySelector('[data-save-incident]');
  if(saveIncBtn) saveIncBtn.onclick = ()=>{
    const desc = scope.querySelector('#incDescription').value.trim();
    if(!desc){ scope.querySelector('#incDescription').focus(); return; }
    reportIncident(saveIncBtn.getAttribute('data-save-incident'), {
      type: scope.querySelector('#incType').value, date: scope.querySelector('#incDate').value,
      person: scope.querySelector('#incPerson').value.trim(), description: desc,
      actions: scope.querySelector('#incActions').value.trim(),
    });
    closeSheet(); render();
  };
  const saveInvBtn = scope.querySelector('[data-save-investigation]');
  if(saveInvBtn) saveInvBtn.onclick = ()=>{
    saveIncidentInvestigation(saveInvBtn.getAttribute('data-inv-site'), saveInvBtn.getAttribute('data-save-investigation'),
      { rootCause: scope.querySelector('#incRootCause').value.trim(), correctiveActions: scope.querySelector('#incCorrective').value.trim() }, false);
    closeSheet(); render();
  };
  const closeIncBtn = scope.querySelector('[data-close-incident]');
  if(closeIncBtn) closeIncBtn.onclick = ()=>{
    saveIncidentInvestigation(closeIncBtn.getAttribute('data-inv-site'), closeIncBtn.getAttribute('data-close-incident'),
      { rootCause: scope.querySelector('#incRootCause').value.trim(), correctiveActions: scope.querySelector('#incCorrective').value.trim() }, true);
    closeSheet(); render();
  };
  const saveRequestBtn = scope.querySelector('[data-save-request]');
  if(saveRequestBtn) saveRequestBtn.onclick = ()=>{
    const title = scope.querySelector('#reqTitle').value.trim();
    if(!title){ scope.querySelector('#reqTitle').focus(); return; }
    createRequest(saveRequestBtn.getAttribute('data-save-request'), {
      type: scope.querySelector('#reqType').value,
      title, message: scope.querySelector('#reqMessage').value.trim(),
      dueDate: scope.querySelector('#reqDue').value,
      linkedReqId: scope.querySelector('#reqLinked').value,
    });
    closeSheet();
  };
  const respondBtn = scope.querySelector('[data-respond-request]');
  if(respondBtn) respondBtn.onclick = ()=>{
    const text = scope.querySelector('#requestResponse').value.trim();
    if(!text){ scope.querySelector('#requestResponse').focus(); return; }
    respondToRequest(respondBtn.getAttribute('data-respond-request'), text);
    closeSheet();
  };
  const completeBtn = scope.querySelector('[data-complete-request]');
  if(completeBtn) completeBtn.onclick = ()=>{
    completeRequest(completeBtn.getAttribute('data-complete-request'));
    closeSheet();
  };
  const contractorSelToggle = scope.querySelector('#newSiteContractor');
  if(contractorSelToggle) contractorSelToggle.onchange = ()=>{
    const fields = scope.querySelector('#newContractorFields');
    if(fields) fields.style.display = contractorSelToggle.value==='__new' ? '' : 'none';
  };
  const saveSiteBtn = scope.querySelector('[data-save-site]');
  if(saveSiteBtn) saveSiteBtn.onclick = ()=>{
    const name = scope.querySelector('#newSiteName').value.trim();
    if(!name){ scope.querySelector('#newSiteName').focus(); return; }
    const contractorSel = scope.querySelector('#newSiteContractor');
    const usingNew = !contractorSel || contractorSel.value==='__new';
    if(usingNew && !scope.querySelector('#newContractorName').value.trim()){
      scope.querySelector('#newContractorName').focus(); return;
    }
    createSite({
      name, location: scope.querySelector('#newSiteLocation').value.trim(),
      contractorId: contractorSel ? contractorSel.value : '__new',
      newContractorName: usingNew ? scope.querySelector('#newContractorName').value.trim() : '',
      newContractorTrade: usingNew ? scope.querySelector('#newContractorTrade').value.trim() : '',
      newContractorContact: usingNew ? scope.querySelector('#newContractorContact').value.trim() : '',
      templateSiteId: scope.querySelector('#newSiteTemplate').value,
    });
    closeSheet();
  };
  const saveProfileBtn = scope.querySelector('[data-save-profile]');
  if(saveProfileBtn) saveProfileBtn.onclick = async ()=>{
    const g = id => { const el = scope.querySelector(id); return el ? el.value.trim() : ''; };
    const data = {
      name: g('#profileName'), company: g('#profileCompany'), accountType: scope.querySelector('#profileType').value,
      regNumber: g('#profileReg'), coidNumber: g('#profileCoid'), vatNumber: g('#profileVat'),
      address: g('#profileAddress'), title: g('#profileTitle'), phone: g('#profilePhone'), email: g('#profileEmail'),
    };
    const avatarInput = scope.querySelector('#avatarInput');
    if(avatarInput && avatarInput.files[0] && assetsCap){
      try{ const asset = await assetsCap.upload(avatarInput.files[0]); data.avatarUrl = asset.url; }catch(e){}
    }
    let myId = null;
    if(userCap){ try{ myId = await userCap.id(); }catch(e){} }
    await saveProfile(myId, data);
    closeSheet();
    showToast('Profile saved');
  };
}

initPersistence();
</script>
</body>
</html>
