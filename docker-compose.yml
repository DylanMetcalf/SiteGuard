# Local development stack: Postgres, S3-compatible storage (MinIO) and a mail
# catcher (Mailpit, UI on http://localhost:8025). Run the app with `npm run dev`
# against it, or uncomment the `app` service to run the production image.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siteguard
      POSTGRES_PASSWORD: siteguard
      POSTGRES_DB: siteguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteguard"]
      interval: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: siteguard
      MINIO_ROOT_PASSWORD: siteguard-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 siteguard siteguard-secret; do sleep 1; done;
                  mc mb --ignore-existing local/siteguard-documents"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # app:
  #   build: .
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgres://siteguard:siteguard@postgres:5432/siteguard
  #     S3_ENDPOINT: http://minio:9000
  #     SMTP_URL: smtp://mailpit:1025
  #   ports: ["3000:3000"]
  #   depends_on: [postgres, minio-bucket, mailpit]

volumes:
  pgdata:
  miniodata:
