# Local stack: Postgres, S3-compatible storage (MinIO), a mail catcher (Mailpit,
# UI on http://localhost:8025) and the app itself.
#   Full run-through:  docker compose up --build   → http://localhost:3000
#   Development:       docker compose up -d postgres mailpit && npm run dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siteguard
      POSTGRES_PASSWORD: siteguard
      POSTGRES_DB: siteguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteguard"]
      interval: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: siteguard
      MINIO_ROOT_PASSWORD: siteguard-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 siteguard siteguard-secret; do sleep 1; done;
                  mc mb --ignore-existing local/siteguard-documents"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  app:
    build: .
    environment:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://siteguard:siteguard@postgres:5432/siteguard
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: siteguard-documents
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: siteguard
      S3_SECRET_ACCESS_KEY: siteguard-secret
      S3_FORCE_PATH_STYLE: "true"
      SMTP_URL: smtp://mailpit:1025
      # Optional: put your Claude API key in a .env file next to this one.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-bucket: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  pgdata:
  miniodata:
